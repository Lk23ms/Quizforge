<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0000FF" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self';" />
<meta http-equiv="X-Content-Type-Options" content="nosniff" />
<title>QuizForge — Tạo & Làm bài kiểm tra</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --blue: #0000FF;
    --blue-mid: #3355ff;
    --blue-soft: #6d8cff;
    --bg: #ffffff;
    --card: rgba(240, 245, 255, 0.75);
    --card-2: rgba(230, 240, 255, 0.95);
    --border: rgba(0, 0, 255, 0.15);
    --border-hot: rgba(0, 0, 255, 0.4);
    --text: #000022;
    --text-dim: #4a5580;
    --danger: #ff3355;
    --ok: #00b87a;
    --radius: 18px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-ios: cubic-bezier(0.34, 1.56, 0.64, 1);
    --shadow-blue: 0 8px 30px rgba(0, 0, 255, 0.12);
    --text-shadow-blue: 0 0 12px rgba(0, 0, 255, 0.35), 0 0 24px rgba(0, 0, 255, 0.15);
  }

  html, body { min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    letter-spacing: -0.01em;
    min-height: 100vh;
  }

  /* BACKGROUND DOT GRID */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image: radial-gradient(rgba(0, 0, 255, 0.18) 1.5px, transparent 1.5px);
    background-size: 24px 24px;
    pointer-events: none;
    z-index: 0;
  }

  #dotCanvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0;
    height: 72px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px 0 104px;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid rgba(0, 0, 255, 0.1);
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0, 0, 255, 0.05);
  }
  .logo {
    font-weight: 800; font-size: 20px;
    letter-spacing: -0.03em;
    display: flex; align-items: center; gap: 10px;
    color: #000;
    text-shadow: var(--text-shadow-blue);
  }
  .logo-mark {
    width: 30px; height: 30px; border-radius: 9px;
    background: linear-gradient(135deg, var(--blue), #5a7bff);
    display: grid; place-items: center;
    font-size: 15px; font-weight: 800; color: #fff;
    box-shadow: 0 4px 14px rgba(0,0,255,0.3);
  }
  .nav-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }

  /* DEV BADGE */
  .dev-badge {
    position: relative; display: flex; align-items: center; gap: 10px;
    cursor: pointer; padding: 4px 12px 4px 4px; border-radius: 22px;
    background: rgba(240, 245, 255, 0.9);
    border: 1px solid rgba(0, 0, 255, 0.15);
    transition: all .35s var(--ease); user-select: none;
    box-shadow: 0 2px 10px rgba(0, 0, 255, 0.05);
  }
  .dev-badge:hover {
    background: #fff; border-color: var(--blue-mid);
    box-shadow: 0 4px 20px rgba(0, 80, 255, 0.2);
  }
  .dev-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(135deg, #ffcc00, #ff9500);
    display: grid; place-items: center; font-weight: 900; font-size: 15px; color: #fff;
    box-shadow: 0 2px 8px rgba(255,150,0,0.3); flex: 0 0 auto;
  }
  .dev-badge-label { font-size: 12px; font-weight: 800; color: var(--blue); letter-spacing: 0.04em; }
  .dev-tooltip {
    position: absolute; top: calc(100% + 14px); right: 0;
    background: #ffffff;
    border: 1px solid rgba(0, 0, 255, 0.2); border-radius: 16px;
    padding: 16px 20px; min-width: 250px;
    opacity: 0; transform: translateY(-10px) scale(0.94);
    transition: opacity .3s var(--ease), transform .4s var(--ease-ios);
    pointer-events: none; box-shadow: 0 10px 40px rgba(0, 0, 255, 0.15);
    z-index: 200; backdrop-filter: blur(20px);
  }
  .dev-badge:hover .dev-tooltip { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  .dev-tooltip-title {
    font-size: 15px; font-weight: 800; margin-bottom: 4px;
    color: var(--blue);
    text-shadow: var(--text-shadow-blue);
  }
  .dev-tooltip-role { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; letter-spacing: 0.04em; text-transform: uppercase; }
  .dev-tooltip-desc { font-size: 13px; color: var(--text); line-height: 1.5; margin-bottom: 10px; }
  .dev-tooltip-link {
    display: block; font-size: 12.5px; font-weight: 700; color: var(--blue);
    padding-top: 10px; border-top: 1px solid rgba(0, 0, 255, 0.1);
  }
  .dev-tooltip::before {
    content: ""; position: absolute; top: -8px; right: 18px;
    width: 14px; height: 14px; background: #ffffff;
    transform: rotate(45deg);
    border-left: 1px solid rgba(0, 0, 255, 0.2); border-top: 1px solid rgba(0, 0, 255, 0.2);
  }

  /* BUTTONS */
  .btn {
    font: inherit; font-size: 14px; font-weight: 600;
    border: 1px solid transparent; border-radius: 12px;
    padding: 10px 18px; cursor: pointer; color: var(--text);
    background: transparent; white-space: nowrap;
    transition: transform .35s var(--ease), background .25s, box-shadow .35s, filter .3s, opacity .25s;
    user-select: none;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: scale(0.97); }
  .btn.primary {
    background: linear-gradient(135deg, var(--blue), var(--blue-mid));
    color: #fff;
    box-shadow: 0 4px 15px rgba(0, 0, 255, 0.3), inset 0 1px 0 rgba(255,255,255,0.2);
    border-color: rgba(0, 0, 255, 0.1);
  }
  .btn.primary:hover { box-shadow: 0 6px 20px rgba(0, 0, 255, 0.45), inset 0 1px 0 rgba(255,255,255,0.3); }
  .btn.ghost {
    background: rgba(240, 245, 255, 0.6);
    border: 1px solid rgba(0, 0, 255, 0.15);
    color: var(--blue);
  }
  .btn.ghost:hover { background: rgba(220, 235, 255, 0.9); border-color: var(--blue-mid); }
  .btn.danger {
    background: rgba(255, 60, 100, 0.1);
    border: 1px solid rgba(255, 60, 100, 0.3);
    color: var(--danger);
  }
  .btn.danger:hover { background: rgba(255, 60, 100, 0.2); }
  .btn.small { padding: 6px 12px; font-size: 13px; border-radius: 9px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

  .icon-btn {
    width: 30px; height: 30px; border-radius: 9px;
    border: 1px solid rgba(0, 0, 255, 0.15);
    background: rgba(255, 255, 255, 0.8);
    color: var(--text-dim); cursor: pointer; font-size: 14px; line-height: 1;
    display: grid; place-items: center; flex: 0 0 auto;
    transition: transform .3s var(--ease), background .2s, color .2s;
  }
  .icon-btn:hover { background: rgba(0, 0, 255, 0.05); color: var(--blue); border-color: rgba(0, 0, 255, 0.3); }
  .icon-btn:active { transform: scale(0.9); }
  .icon-btn.danger:hover { background: rgba(255, 60, 100, 0.1); color: var(--danger); border-color: var(--danger); }

  /* MAIN */
  main {
    position: relative; z-index: 2;
    padding: 108px 28px 80px 104px;
    max-width: 1180px; margin: 0 auto;
    min-height: 100vh;
  }

  .view { animation: viewIn .6s var(--ease); }
  @keyframes viewIn {
    from { opacity: 0; transform: translateY(18px); filter: blur(4px); }
    to   { opacity: 1; transform: none; filter: blur(0); }
  }

  .page-title {
    font-size: clamp(26px, 4vw, 36px); font-weight: 800;
    letter-spacing: -0.035em; margin-bottom: 8px;
    color: #000;
    text-shadow: var(--text-shadow-blue);
  }
  .page-sub { color: var(--text-dim); margin-bottom: 28px; font-size: 15px; font-weight: 500; }

  /* HERO */
  .hero { padding-top: 24px; }
  .hero h1 {
    font-size: clamp(32px, 6vw, 62px); font-weight: 800;
    letter-spacing: -0.045em; line-height: 1.04; max-width: 820px;
    color: #000;
    text-shadow: var(--text-shadow-blue);
  }
  .grad {
    background: linear-gradient(120deg, var(--blue), #6688ff, var(--blue));
    background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 6s linear infinite;
  }
  @keyframes shimmer { to { background-position: 200% center; } }
  .hero .sub {
    margin-top: 20px; font-size: 17px; color: var(--text-dim);
    max-width: 560px; line-height: 1.55; font-weight: 500;
  }
  .hero-cards {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px; margin-top: 48px; max-width: 780px;
  }
  .hero-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 26px; cursor: pointer;
    transition: transform .55s var(--ease), border-color .3s, box-shadow .55s, background .3s;
    position: relative; overflow: hidden;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    box-shadow: var(--shadow-blue);
  }
  .hero-card::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle at 80% 0%, rgba(0, 80, 255, 0.08), transparent 60%);
    opacity: 0; transition: opacity .5s; pointer-events: none;
  }
  .hero-card:hover {
    transform: translateY(-6px);
    border-color: var(--border-hot);
    box-shadow: 0 15px 40px rgba(0, 40, 255, 0.15);
    background: var(--card-2);
  }
  .hero-card:hover::after { opacity: 1; }
  .hero-card h2 { font-size: 19px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.02em; color: #000; }
  .hero-card p { font-size: 14px; color: var(--text-dim); line-height: 1.5; }

  /* BUILDER */
  .builder-topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
  .builder-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .mode-tabs {
    display: flex; gap: 6px;
    background: rgba(240, 245, 255, 0.7);
    border-radius: 12px; padding: 5px; margin-bottom: 22px;
    width: fit-content; border: 1px solid rgba(0, 0, 255, 0.1);
  }
  .mode-tabs button {
    font: inherit; font-size: 14px; font-weight: 700;
    padding: 10px 18px; border-radius: 9px; border: none;
    background: transparent; color: var(--text-dim); cursor: pointer;
    transition: all .35s var(--ease);
  }
  .mode-tabs button.active {
    background: #fff; color: var(--blue);
    box-shadow: 0 2px 10px rgba(0, 0, 255, 0.1);
  }

  .title-input {
    width: 100%; font: inherit; font-size: 26px; font-weight: 800;
    letter-spacing: -0.03em; color: #000; background: transparent;
    border: none; border-bottom: 2px solid rgba(0, 0, 255, 0.15);
    padding: 14px 0; outline: none; transition: border-color .3s;
    text-shadow: var(--text-shadow-blue);
  }
  .title-input:focus { border-bottom-color: var(--blue); }
  .title-input::placeholder { color: rgba(0, 0, 255, 0.25); text-shadow: none; }

  .desc-input {
    width: 100%; font: inherit; font-size: 15px; color: var(--text);
    background: transparent; border: none;
    border-bottom: 1px solid rgba(0, 0, 255, 0.1);
    padding: 12px 0; outline: none; resize: vertical; min-height: 48px;
    margin-bottom: 22px; transition: border-color .3s;
  }
  .desc-input:focus { border-bottom-color: var(--blue); }
  .desc-input::placeholder { color: rgba(0, 0, 255, 0.3); }

  .settings-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 14px; margin-bottom: 28px; padding: 20px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    box-shadow: var(--shadow-blue);
  }
  .setting { display: flex; flex-direction: column; gap: 7px; }
  .setting label { font-size: 12px; font-weight: 700; color: var(--blue); text-transform: uppercase; letter-spacing: 0.06em; }
  .setting input[type="number"],
  .setting input[type="text"],
  .setting input[type="datetime-local"] {
    font: inherit; font-size: 14px; color: #000;
    background: #ffffff;
    border: 1px solid rgba(0, 0, 255, 0.15);
    border-radius: 10px; padding: 10px 12px; outline: none; width: 100%;
    transition: border-color .25s, box-shadow .25s;
  }
  .setting input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0, 0, 255, 0.1); }
  .setting input[type="datetime-local"] { color-scheme: light; }

  .switch { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; padding-top: 6px; }
  .switch input { display: none; }
  .switch .track {
    width: 42px; height: 25px; border-radius: 20px;
    background: rgba(0, 0, 255, 0.15);
    position: relative; transition: background .35s var(--ease); flex: 0 0 auto;
  }
  .switch .track::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 19px; height: 19px; border-radius: 50%;
    background: #fff; transition: transform .4s var(--ease-ios), background .3s;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .switch input:checked + .track { background: var(--blue); }
  .switch input:checked + .track::after { transform: translateX(17px); }

  .q-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    animation: cardIn .45s var(--ease);
    transition: border-color .3s, box-shadow .3s;
    box-shadow: var(--shadow-blue);
  }
  .q-card:hover { border-color: var(--border-hot); box-shadow: 0 10px 30px rgba(0, 0, 255, 0.1); }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(14px) scale(0.98); filter: blur(3px); }
    to { opacity: 1; transform: none; filter: blur(0); }
  }
  .q-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .q-num { font-size: 13px; font-weight: 800; color: var(--blue); white-space: nowrap; }
  .q-type {
    font: inherit; font-size: 13px; color: var(--text);
    background: #fff; border: 1px solid rgba(0, 0, 255, 0.2);
    border-radius: 9px; padding: 6px 10px; outline: none; cursor: pointer;
  }
  .q-points {
    width: 66px; font: inherit; font-size: 13px; color: #000;
    background: #fff; border: 1px solid rgba(0, 0, 255, 0.2);
    border-radius: 9px; padding: 6px 10px; outline: none; margin-left: auto;
  }
  .pts-label { font-size: 12px; color: var(--text-dim); font-weight: 600; }
  .q-text {
    width: 100%; font: inherit; font-size: 16px; font-weight: 700;
    color: #000; background: transparent; border: none;
    border-bottom: 1px solid rgba(0, 0, 255, 0.1);
    padding: 10px 0; outline: none; margin-bottom: 14px;
    transition: border-color .3s;
  }
  .q-text:focus { border-bottom-color: var(--blue); }
  .q-text::placeholder { color: rgba(0, 0, 255, 0.3); font-weight: 500; }
  
  .q-options { display: flex; flex-direction: column; gap: 9px; margin-bottom: 12px; }
  .q-option { display: flex; align-items: center; gap: 10px; animation: cardIn .35s var(--ease); }
  .q-option input[type="radio"], .q-option input[type="checkbox"] {
    appearance: none; -webkit-appearance: none;
    width: 20px; height: 20px; flex: 0 0 auto;
    border: 2px solid rgba(0, 0, 255, 0.3); border-radius: 50%;
    background: #fff; cursor: pointer; position: relative;
    transition: border-color .25s, background .25s, transform .3s var(--ease-ios);
  }
  .q-option input[type="checkbox"] { border-radius: 6px; }
  .q-option input:checked { border-color: var(--blue); background: rgba(0, 0, 255, 0.05); }
  .q-option input[type="radio"]:checked::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--blue); }
  .q-option input[type="checkbox"]:checked::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--blue); font-size: 12px; font-weight: 900; }
  
  .opt-text {
    flex: 1; font: inherit; font-size: 14px; color: #000;
    background: #fff; border: 1px solid rgba(0, 0, 255, 0.15);
    border-radius: 9px; padding: 9px 12px; outline: none;
    transition: border-color .25s, background .25s;
  }
  .opt-text:focus { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(0, 0, 255, 0.05); }
  .opt-text::placeholder { color: rgba(0, 0, 255, 0.3); }
  
  .q-required { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-dim); cursor: pointer; user-select: none; margin-top: 6px; font-weight: 600; }
  .q-required input { accent-color: var(--blue); width: 16px; height: 16px; }
  
  .add-q {
    width: 100%; padding: 18px; border: 2px dashed rgba(0, 0, 255, 0.25);
    border-radius: var(--radius); background: rgba(240, 245, 255, 0.5);
    color: var(--blue); font-weight: 700; transition: all .35s var(--ease);
  }
  .add-q:hover { border-color: var(--blue); background: rgba(230, 240, 255, 0.8); color: var(--blue-mid); }

  /* CODE EDITOR */
  .code-editor-wrap { display: grid; grid-template-columns: 1fr; gap: 18px; }
  .code-area {
    width: 100%; min-height: 480px;
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 13.5px; line-height: 1.65;
    color: #000; background: #fff;
    border: 1px solid rgba(0, 0, 255, 0.2);
    border-radius: var(--radius); padding: 20px; outline: none;
    resize: vertical; tab-size: 2;
    transition: border-color .3s, box-shadow .3s;
  }
  .code-area:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0, 0, 255, 0.1); }
  .code-area::placeholder { color: rgba(0, 0, 255, 0.3); }
  .code-toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .code-format-hint {
    background: rgba(240, 245, 255, 0.7);
    border: 1px solid rgba(0, 0, 255, 0.15);
    border-radius: var(--radius); padding: 18px 20px;
    font-size: 13px; color: var(--text-dim); line-height: 1.75;
  }
  .code-format-hint b { color: #000; font-size: 13.5px; }
  .code-format-hint code { font-family: "SF Mono", monospace; color: var(--blue); background: rgba(0, 0, 255, 0.05); padding: 1px 6px; border-radius: 5px; font-size: 12.5px; }
  .code-format-hint pre { background: rgba(0, 0, 255, 0.03); border: 1px solid rgba(0, 0, 255, 0.1); border-radius: 10px; padding: 14px; margin-top: 10px; overflow-x: auto; color: #000; font-size: 12.5px; line-height: 1.65; }
  .code-format-hint details { margin-top: 10px; }
  .code-format-hint summary { cursor: pointer; color: var(--blue); font-weight: 700; font-size: 13px; padding: 6px 0; }

  /* CODE ENTRY / TAKE */
  .code-entry, .postcode-filter { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; max-width: 620px; }
  .code-entry input, .postcode-filter input {
    flex: 1; min-width: 180px; font: inherit; font-size: 15px; color: #000;
    background: #fff; border: 1px solid rgba(0, 0, 255, 0.15); border-radius: 13px;
    padding: 13px 16px; outline: none;
    transition: border-color .25s, box-shadow .25s;
    box-shadow: 0 4px 15px rgba(0, 0, 255, 0.03);
  }
  .code-entry input:focus, .postcode-filter input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0, 0, 255, 0.1); }
  .code-entry input::placeholder, .postcode-filter input::placeholder { color: rgba(0, 0, 255, 0.3); }

  .test-runner { animation: viewIn .6s var(--ease); }
  .test-header {
    position: sticky; top: 84px;
    display: flex; justify-content: space-between; align-items: center;
    gap: 14px; flex-wrap: wrap; padding: 16px 20px;
    background: rgba(255, 255, 255, 0.9); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 22px;
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    z-index: 50; box-shadow: 0 8px 25px rgba(0, 0, 255, 0.08);
  }
  .test-header h2 { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; color: #000; }
  .test-meta { font-size: 13px; color: var(--text-dim); margin-top: 4px; font-weight: 500; }
  .timer {
    font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums;
    padding: 8px 16px; border-radius: 12px;
    background: rgba(0, 0, 255, 0.08); border: 1px solid rgba(0, 0, 255, 0.2); color: var(--blue);
    transition: background .3s, color .3s;
  }
  .timer.warn { background: rgba(255, 60, 100, 0.1); border-color: rgba(255, 60, 100, 0.3); color: var(--danger); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .55; } }

  .question-block {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 22px; margin-bottom: 16px;

<script>
/* ============================================================
   UTILITIES
============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
if (isIOS) document.body.classList.add("ios");

function fmtDateTime(ts) {
  const d = new Date(ts), p = n => String(n).padStart(2, "0");
  return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function fmtTime(sec) {
  sec = Math.max(0, sec | 0);
  return `${String(Math.floor(sec / 60)).padStart(2, "0")}:${String(sec % 60).padStart(2, "0")}`;
}
let toastEl = null, toastTimer = null;
function toast(msg) {
  if (!toastEl) {
    toastEl = document.createElement("div");
    toastEl.className = "toast";
    document.body.appendChild(toastEl);
  }
  toastEl.textContent = msg;
  requestAnimationFrame(() => toastEl.classList.add("show"));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.classList.remove("show"); }, 2600);
}

// Hàm giả lập IP (chỉ admin mới thấy)
function getFakeIP() {
  return `14.${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}`;
}

/* ============================================================
   SECURITY MODULE
============================================================ */
const Security = {
  RATE: { maxAttempts: 5, windowMs: 15 * 60 * 1000, lockoutMs: 15 * 60 * 1000 },
  SESSION_DAYS: 7,

  hashPass(str) {
    let h1 = 0x811c9dc5, h2 = 0x1000193;
    const s = "qf::" + str + "::salt";
    for (let i = 0; i < s.length; i++) {
      const c = s.charCodeAt(i);
      h1 = (h1 ^ c) * 16777619;
      h2 = ((h2 << 5) - h2 + c) | 0;
    }
    return (h1 >>> 0).toString(36) + (h2 >>> 0).toString(36);
  },

  checkRateLimit(username) {
    const key = "qf_rate_" + this.hashPass(username);
    const now = Date.now();
    try {
      const d = JSON.parse(localStorage.getItem(key) || '{"attempts":[],"lockUntil":0}');
      if (d.lockUntil && now < d.lockUntil) return { blocked: true, until: d.lockUntil };
      d.attempts = (d.attempts || []).filter(t => now - t < this.RATE.windowMs);
      if (d.attempts.length >= this.RATE.maxAttempts) {
        d.lockUntil = now + this.RATE.lockoutMs;
        localStorage.setItem(key, JSON.stringify(d));
        return { blocked: true, until: d.lockUntil };
      }
      return { blocked: false, remaining: this.RATE.maxAttempts - d.attempts.length };
    } catch { return { blocked: false }; }
  },
  recordFailure(username) {
    const key = "qf_rate_" + this.hashPass(username);
    const now = Date.now();
    try {
      const d = JSON.parse(localStorage.getItem(key) || '{"attempts":[],"lockUntil":0}');
      d.attempts = [...(d.attempts || []).filter(t => now - t < this.RATE.windowMs), now];
      localStorage.setItem(key, JSON.stringify(d));
    } catch {}
  },
  clearFailures(username) {
    try { localStorage.removeItem("qf_rate_" + this.hashPass(username)); } catch {}
  },

  checkPasswordStrength(pass) {
    if (pass.length < 6) return { ok: false, msg: "Mật khẩu phải có ít nhất 6 ký tự." };
    if (pass.length > 128) return { ok: false, msg: "Mật khẩu quá dài (tối đa 128 ký tự)." };
    if (!/[a-zA-Z]/.test(pass)) return { ok: false, msg: "Mật khẩu phải chứa ít nhất 1 chữ cái." };
    if (!/[0-9]/.test(pass)) return { ok: false, msg: "Mật khẩu phải chứa ít nhất 1 chữ số." };
    return { ok: true };
  },

  validateSession() {
    const cur = localStorage.getItem("qf_current");
    const exp = parseInt(localStorage.getItem("qf_session_exp") || "0", 10);
    if (cur && exp && Date.now() > exp) {
      localStorage.removeItem("qf_current");
      localStorage.removeItem("qf_session_exp");
      return null;
    }
    return cur || null;
  },
  startSession(username) {
    localStorage.setItem("qf_current", username);
    localStorage.setItem("qf_session_exp", String(Date.now() + this.SESSION_DAYS * 86400 * 1000));
  },
  endSession() {
    localStorage.removeItem("qf_current");
    localStorage.removeItem("qf_session_exp");
  },

  secureCode(len = 8) {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let s = "";
    if (window.crypto && window.crypto.getRandomValues) {
      const arr = new Uint32Array(len);
      window.crypto.getRandomValues(arr);
      for (let i = 0; i < len; i++) s += chars[arr[i] % chars.length];
    } else {
      for (let i = 0; i < len; i++) s += chars[Math.floor(Math.random() * chars.length)];
    }
    return s;
  },

  sanitize(obj, depth = 0) {
    if (depth > 10) return null;
    if (obj === null || typeof obj !== "object") {
      if (typeof obj === "string" && obj.length > 5000) return obj.slice(0, 5000);
      return obj;
    }
    if (Array.isArray(obj)) return obj.slice(0, 500).map(o => this.sanitize(o, depth + 1));
    const out = {};
    for (const key of Object.keys(obj)) {
      if (key === "__proto__" || key === "constructor" || key === "prototype") continue;
      if (key.length > 100) continue;
      out[key] = this.sanitize(obj[key], depth + 1);
    }
    return out;
  },

  deterSourceView() {
    document.addEventListener('contextmenu', e => {
      e.preventDefault();
      toast("⚠️ Chuột phải đã bị vô hiệu hoá vì lý do bảo mật.");
      return false;
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'F12') {
        e.preventDefault();
        toast("⚠️ DevTools đã bị chặn.");
        return false;
      }
      if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) {
        e.preventDefault();
        toast("⚠️ DevTools đã bị chặn.");
        return false;
      }
      if (e.ctrlKey && e.key.toUpperCase() === 'U') {
        e.preventDefault();
        toast("⚠️ Xem mã nguồn đã bị vô hiệu hoá.");
        return false;
      }
      if (e.ctrlKey && e.key.toUpperCase() === 'S') {
        e.preventDefault();
        toast("⚠️ Lưu trang đã bị vô hiệu hoá.");
        return false;
      }
    });
  }
};

// ĐÃ CẬP NHẬT PASSCODE ADMIN MỚI THEO YÊU CẦU
const ADMIN_PASSCODE = "16112010Khoi@";

/* ============================================================
   STATE
============================================================ */
const State = { users: [], currentUser: null, forms: [], responses: [], postcodes: [] };

function loadDB() {
  try { State.users = JSON.parse(localStorage.getItem("qf_users") || "[]"); } catch { State.users = []; }
  try { State.forms = JSON.parse(localStorage.getItem("qf_forms") || "[]"); } catch { State.forms = []; }
  try { State.responses = JSON.parse(localStorage.getItem("qf_responses") || "[]"); } catch { State.responses = []; }
  try { State.postcodes = JSON.parse(localStorage.getItem("qf_postcodes") || "[]"); } catch { State.postcodes = []; }
  State.currentUser = Security.validateSession();
  if (State.currentUser && !State.users.find(u => u.username === State.currentUser)) {
    State.currentUser = null;
    Security.endSession();
  }
}
function saveDB() {
  try {
    localStorage.setItem("qf_users", JSON.stringify(State.users));
    localStorage.setItem("qf_forms", JSON.stringify(State.forms));
    localStorage.setItem("qf_responses", JSON.stringify(State.responses));
    localStorage.setItem("qf_postcodes", JSON.stringify(State.postcodes));
  } catch (e) {
    if (e.name === "QuotaExceededError") toast("Bộ nhớ đầy — hãy xoá bớt dữ liệu cũ.");
  }
}
const getUser = () => State.users.find(u => u.username === State.currentUser) || null;
const isAdmin = () => !!(getUser()?.isAdmin);

/* ============================================================
   DOT CHAIN CANVAS
============================================================ */
const dotCanvas = $("#dotCanvas");
const dctx = dotCanvas.getContext("2d");
let dots = [];
let dotMouse = { x: -9999, y: -9999 };

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  dotCanvas.width = w * dpr; dotCanvas.height = h * dpr;
  dotCanvas.style.width = w + "px"; dotCanvas.style.height = h + "px";
  dctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  layoutDots();
}
function layoutDots() {
  dots = [];
  const mob = innerWidth < 720;
  const x = mob ? 26 : 46, sp = mob ? 46 : 60;
  for (let y = 110; y < innerHeight - 50; y += sp) {
    dots.push({ x, y, baseR: mob ? 2.6 : 3.6, hover: 0 });
  }
}
addEventListener("mousemove", e => { dotMouse.x = e.clientX; dotMouse.y = e.clientY; }, { passive: true });
addEventListener("touchmove", e => {
  if (e.touches[0]) { dotMouse.x = e.touches[0].clientX; dotMouse.y = e.touches[0].clientY; }
}, { passive: true });
addEventListener("mouseleave", () => { dotMouse.x = -9999; dotMouse.y = -9999; });
addEventListener("touchend", () => { dotMouse.x = -9999; dotMouse.y = -9999; });

function drawDots() {
  const W = innerWidth, H = innerHeight, R = 140;
  dctx.clearRect(0, 0, W, H);
  for (const d of dots) {
    const dist = Math.hypot(d.x - dotMouse.x, d.y - dotMouse.y);
    const target = dist < R ? 1 - dist / R : 0;
    d.hover += (target - d.hover) * 0.18;
  }
  for (let i = 0; i < dots.length - 1; i++) {
    const a = dots[i], b = dots[i + 1];
    const h = Math.max(a.hover, b.hover);
    if (h > 0.02) {
      dctx.beginPath(); dctx.moveTo(a.x, a.y); dctx.lineTo(b.x, b.y);
      dctx.strokeStyle = `rgba(0, 80, 255, ${h * 0.7})`;
      dctx.lineWidth = 1.2 + h * 1.8; dctx.stroke();
    }
  }
  for (const d of dots) {
    if (d.hover > 0.04 && Math.hypot(d.x - dotMouse.x, d.y - dotMouse.y) < R * 1.4) {
      dctx.beginPath(); dctx.moveTo(d.x, d.y); dctx.lineTo(dotMouse.x, dotMouse.y);
      dctx.strokeStyle = `rgba(0, 80, 255, ${d.hover * 0.25})`;
      dctx.lineWidth = 1; dctx.stroke();
    }
  }
  for (const d of dots) {
    const r = d.baseR + d.hover * 4.5;
    if (d.hover > 0.05) {
      const g = dctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, r * 4.5);
      g.addColorStop(0, `rgba(0, 80, 255, ${d.hover * 0.35})`);
      g.addColorStop(1, "rgba(0, 80, 255, 0)");
      dctx.fillStyle = g;
      dctx.beginPath(); dctx.arc(d.x, d.y, r * 4.5, 0, 7); dctx.fill();
    }
    dctx.beginPath(); dctx.arc(d.x, d.y, r, 0, 7);
    dctx.fillStyle = `rgba(0, 80, 255, ${0.3 + d.hover * 0.7})`;
    dctx.fill();
  }
  requestAnimationFrame(drawDots);
}
addEventListener("resize", resizeCanvas);

const app = $("#app");

function openAuth(tab = "login", onSuccess) {
  const root = $("#modalRoot");
  root.innerHTML = `
    <div class="modal-backdrop" data-close="1">
      <div class="modal">
        <button class="modal-close" data-close="1" aria-label="Đóng">✕</button>
        <div class="auth-tabs">

          <button data-tab="register" class="${tab === "register" ? "active" : ""}">Đăng ký</button>
        </div>
        <div class="auth-body"></div>
      </div>
    </div>
  `;
  const bodyEl = $(".auth-body");

  function renderForm(t) {
    if (t === "login") {
      bodyEl.innerHTML = `
        <form id="authForm" autocomplete="on">
          <div class="field">
            <label>Tên đăng nhập</label>
            <input name="username" autocomplete="username" required maxlength="64" />
          </div>
          <div class="field">
            <label>Mật khẩu</label>
            <input name="password" type="password" autocomplete="current-password" required maxlength="128" />
          </div>
          <div class="field">
            <label>Admin passcode (tùy chọn)</label>
            <input name="passcode" type="password" placeholder="Bỏ trống nếu là người dùng thường" maxlength="64" />
            <small>Chỉ admin mới cần nhập.</small>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn ghost" data-close="1">Hủy</button>
            <button type="submit" class="btn primary">Đăng nhập</button>
          </div>
        </form>
      `;
    } else {
      bodyEl.innerHTML = `
        <form id="authForm" autocomplete="on">
          <div class="field">
            <label>Tên đăng nhập</label>
            <input name="username" autocomplete="username" required minlength="3" maxlength="64" />
          </div>
          <div class="field">
            <label>Mật khẩu</label>
            <input name="password" type="password" autocomplete="new-password" required minlength="6" maxlength="128" />
            <small>Tối thiểu 6 ký tự, có chữ cái và chữ số.</small>
          </div>
          <div class="field">
            <label>Nhập lại mật khẩu</label>
            <input name="confirm" type="password" autocomplete="new-password" required maxlength="128" />
          </div>
          <div class="field">
            <label>Admin passcode (tùy chọn)</label>
            <input name="passcode" type="password" placeholder="Bỏ trống nếu là người dùng thường" maxlength="64" />
            <small>Để trống nếu bạn là người dùng thường.</small>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn ghost" data-close="1">Hủy</button>
            <button type="submit" class="btn primary">Tạo tài khoản</button>
          </div>
        </form>
      `;
    }

    $("#authForm", bodyEl).addEventListener("submit", e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const username = String(fd.get("username") || "").trim();
      const password = String(fd.get("password") || "");
      const passcode = String(fd.get("passcode") || "");

      if (!username || username.length > 64) return toast("Tên đăng nhập không hợp lệ");

      if (t === "login") {
        const rl = Security.checkRateLimit(username);
        if (rl.blocked) {
          const min = Math.ceil((rl.until - Date.now()) / 60000);
          return toast(`Đã bị tạm khoá do sai quá nhiều. Thử lại sau ${min} phút.`);
        }
        const u = State.users.find(x => x.username.toLowerCase() === username.toLowerCase());
        if (!u || u.pass !== Security.hashPass(password)) {
          Security.recordFailure(username);
          return toast("Sai tên đăng nhập hoặc mật khẩu");
        }
        if (passcode && passcode === ADMIN_PASSCODE) u.isAdmin = true;
        Security.clearFailures(username);
        Security.startSession(u.username);
        State.currentUser = u.username;
        saveDB();
        closeModal();
        toast(`Chào mừng ${u.username}${u.isAdmin ? " (admin)" : ""}!`);
        render();
        if (pendingCode) {
          const c = pendingCode; pendingCode = null;
          navigate("take");
          setTimeout(() => loadTestByCode(c), 120);
        }
        onSuccess && onSuccess();
      } else {
        const confirm = String(fd.get("confirm") || "");
        if (password !== confirm) return toast("Mật khẩu nhập lại không khớp");
        const s = Security.checkPasswordStrength(password);
        if (!s.ok) return toast(s.msg);
        if (State.users.some(x => x.username.toLowerCase() === username.toLowerCase())) {
          return toast("Tên đăng nhập đã tồn tại");
        }
        const newUser = {
          username,
          pass: Security.hashPass(password),
          isAdmin: passcode === ADMIN_PASSCODE,
          createdAt: Date.now(),
        };
        State.users.push(newUser);
        Security.startSession(username);
        State.currentUser = username;
        saveDB();
        closeModal();
        toast(`Đã tạo tài khoản ${username}${newUser.isAdmin ? " (admin)" : ""}!`);
        render();
        onSuccess && onSuccess();
      }
    });
  }

  renderForm(tab);
  root.querySelectorAll("[data-tab]").forEach(btn => {
    btn.addEventListener("click", () => {
      root.querySelectorAll("[data-tab]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderForm(btn.dataset.tab);
    });
  });
  root.querySelectorAll("[data-close]").forEach(el => {
    el.addEventListener("click", e => { if (e.target === el) closeModal(); });
  });
}
function closeModal() { $("#modalRoot").innerHTML = ""; }

/* ============================================================
   BUILDER
============================================================ */
function newEmptyBuilder() {
  return {
    title: "", description: "", postcode: "",
    settings: { timeLimit: 0, dueDate: "", shuffle: false },
    questions: [],
  };
}
function initBuilder() {
  builder = newEmptyBuilder();
  bHistory = [JSON.stringify(builder)];
  bIdx = 0;
}
function snapshot() {
  const s = JSON.stringify(builder);
  if (bHistory[bIdx] === s) return;
  bHistory = bHistory.slice(0, bIdx + 1);
  bHistory.push(s);
  bIdx++;
  if (bHistory.length > 80) { bHistory.shift(); bIdx--; }
}
function undoBuilder() { if (bIdx > 0) { bIdx--; builder = JSON.parse(bHistory[bIdx]); renderCreate(true); toast("Undo"); } }
function redoBuilder() { if (bIdx < bHistory.length - 1) { bIdx++; builder = JSON.parse(bHistory[bIdx]); renderCreate(true); toast("Redo"); } }

function newQuestion(type = "radio") {
  const q = { id: uid("q"), type, text: "", points: 1, required: false, explanation: "", correct: [] };
  if (type === "radio" || type === "checkbox") {
    q.options = [{ id: uid("o"), text: "" }, { id: uid("o"), text: "" }];
  } else if (type === "boolean") {
    q.options = [{ id: uid("o"), text: "Đúng" }, { id: uid("o"), text: "Sai" }];
  } else {
    q.correct = "";
  }
  return q;
}

function renderCreate(keepScroll) {
  if (!builder) initBuilder();
  const scrollY = window.scrollY;
  const pcOpts = State.postcodes.map(p => `<option value="${esc(p.code)}">${esc(p.code)} — ${esc(p.className)} (${esc(p.subject)})</option>`).join("");

  app.innerHTML = `
    <section class="view">
      <div class="builder-topbar">
        <button class="btn ghost" data-nav="home">← Trang chủ</button>
        <div class="builder-actions">
          <button class="btn ghost small" id="undoBtn" ${bIdx <= 0 ? "disabled" : ""}>↶ Undo</button>
          <button class="btn ghost small" id="redoBtn" ${bIdx >= bHistory.length - 1 ? "disabled" : ""}>↷ Redo</button>
          <button class="btn ghost small" id="clearBtn">🗑 Xoá hết</button>
          <button class="btn primary" id="exportBtn">Xuất bài kiểm tra</button>
        </div>
      </div>

      <div class="mode-tabs">
        <button data-mode="visual" class="${builderMode === "visual" ? "active" : ""}">🖼 Trực quan</button>
        <button data-mode="code" class="${builderMode === "code" ? "active" : ""}">📝 Code</button>
      </div>

      <div id="builderBody"></div>
    </section>
  `;

  if (builderMode === "visual") renderVisualBuilder(pcOpts);
  else renderCodeBuilder();

  $("#undoBtn")?.addEventListener("click", undoBuilder);
  $("#redoBtn")?.addEventListener("click", redoBuilder);
  $("#clearBtn")?.addEventListener("click", () => {
    if (!confirm("Xoá toàn bộ nội dung bài kiểm tra?")) return;
    initBuilder(); renderCreate();
  });
  $("#exportBtn")?.addEventListener("click", openExportModal);
  $$(".mode-tabs button").forEach(b => b.addEventListener("click", () => {
    builderMode = b.dataset.mode; renderCreate(true);
  }));

  if (keepScroll) scrollTo({ top: scrollY });
  else scrollTo({ top: 0, behavior: "smooth" });

function renderVisualBuilder(pcOpts) {

  $("#setDue").addEventListener("input", e => { builder.settings.dueDate = e.target.value; snapshot(); });
  $("#setPostcode").addEventListener("input", e => { builder.postcode = e.target.value.slice(0, 40); snapshot(); });
  $("#setShuffle").addEventListener("change", e => { builder.settings.shuffle = e.target.checked; snapshot(); });
  $("#addQ").addEventListener("click", () => {

function renderQuestionsList() {
  const list = $("#questionsList");
  if (!list) return;
  if (builder.questions.length === 0) {
    list.innerHTML = `<div class="empty"><div class="big">📝</div>Chưa có câu hỏi nào. Nhấn "Thêm câu hỏi" để bắt đầu.</div>`;
    return;
  }
  list.innerHTML = builder.questions.map((q, i) => renderQuestionCard(q, i)).join("");
  bindQuestionEvents();
}

function renderQuestionCard(q, i) {
  const typeLabels = { 
    radio: "Trắc nghiệm (1 đáp án)", 
    checkbox: "Nhiều đáp án", 
    text: "Tự luận",
    boolean: "Đúng / Sai"
  };
  const typeOpts = Object.entries(typeLabels).map(([v, l]) =>
    `<option value="${v}" ${q.type === v ? "selected" : ""}>${l}</option>`
  ).join("");

  let optionsHtml = "";
  if (q.type === "radio" || q.type === "checkbox" || q.type === "boolean") {
    optionsHtml = `
      <div class="q-options">
        ${q.options.map((o, oi) => `
          <div class="q-option" data-oi="${oi}">
            <input type="${q.type === "checkbox" ? "checkbox" : "radio"}" ${(Array.isArray(q.correct) && q.correct.includes(o.id)) ? "checked" : ""} data-opt-id="${esc(o.id)}" />
            <input class="opt-text" type="text" placeholder="Đáp án ${oi + 1}" maxlength="500" value="${esc(o.text)}" data-oi="${oi}" ${q.type === "boolean" ? "readonly" : ""} />
            <button class="icon-btn danger" data-del-opt="${oi}" title="Xoá" ${q.type === "boolean" ? "disabled" : ""}>✕</button>
          </div>
        `).join("")}
      </div>
      ${q.type === "boolean" ? "" : `<button class="btn ghost small" data-add-opt="${i}">+ Thêm đáp án</button>`}
    `;
  } else {
    optionsHtml = `
      <div class="q-option" style="gap:8px;">
        <span style="font-size:12px;color:var(--text-dim);font-weight:600;white-space:nowrap;">Đáp án đúng:</span>
        <input class="opt-text" type="text" placeholder="Nhập đáp án đúng..." maxlength="500" value="${esc(q.correct || "")}" data-text-answer="1" />
      </div>
    `;
  }

  return `
    <div class="q-card" data-qi="${i}">
      <div class="q-head">
        <span class="q-num">Câu ${i + 1}</span>
        <select class="q-type" data-qtype="${i}">${typeOpts}</select>
        <span class="pts-label">Điểm:</span>
        <input class="q-points" type="number" min="0" max="100" step="0.5" value="${q.points}" data-qpoints="${i}" />
        <button class="icon-btn danger" data-del-q="${i}" title="Xoá câu">🗑</button>
      </div>
      <input class="q-text" placeholder="Nội dung câu hỏi..." maxlength="1000" value="${esc(q.text)}" data-qtext="${i}" />
      
      ${optionsHtml}

      <div style="margin-top:16px; margin-bottom:8px;">
        <label style="font-size:12px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; display:block; margin-bottom:6px;">Giải thích đáp án (Tùy chọn)</label>
        <textarea class="opt-text" style="width:100%; min-height:60px; resize:vertical; font-size:13.5px;" placeholder="Nhập lời giải thích chi tiết cho đáp án đúng..." maxlength="1000" data-qexplanation="${i}">${esc(q.explanation || "")}</textarea>
      </div>

      <label class="q-required">
        <input type="checkbox" ${q.required ? "checked" : ""} data-qreq="${i}" />
        Bắt buộc trả lời
      </label>
    </div>
  `;
}

function bindQuestionEvents() {
  $$("[data-qtype]").forEach(sel => sel.addEventListener("change", e => {
    const i = +e.target.dataset.qtype;
    const old = builder.questions[i];
    const newQ = newQuestion(e.target.value);
    newQ.text = old.text; newQ.points = old.points; newQ.required = old.required; newQ.explanation = old.explanation;
    builder.questions[i] = newQ;
    snapshot(); renderQuestionsList();
  }));
  $$("[data-qpoints]").forEach(inp => inp.addEventListener("input", e => {
    const i = +e.target.dataset.qpoints;
    builder.questions[i].points = Math.max(0, Math.min(100, parseFloat(e.target.value) || 0));
    snapshot();
  }));
  $$("[data-qtext]").forEach(inp => inp.addEventListener("input", e => {
    builder.questions[+e.target.dataset.qtext].text = e.target.value;
    snapshot();
  }));
  $$("[data-qexplanation]").forEach(inp => inp.addEventListener("input", e => {
    builder.questions[+e.target.dataset.qexplanation].explanation = e.target.value;
    snapshot();
  }));
  $$("[data-qreq]").forEach(inp => inp.addEventListener("change", e => {
    builder.questions[+e.target.dataset.qreq].required = e.target.checked;
    snapshot();
  }));
  $$("[data-del-q]").forEach(btn => btn.addEventListener("click", () => {
    const i = +btn.dataset.delQ;
    if (!confirm("Xoá câu này?")) return;
    builder.questions.splice(i, 1);
    snapshot(); renderQuestionsList();
  }));
  $$("[data-oi]").forEach(inp => inp.addEventListener("input", e => {
    if (!e.target.classList.contains("opt-text")) return;
    const card = e.target.closest(".q-card");
    const i = +card.dataset.qi;
    const oi = +e.target.dataset.oi;
    builder.questions[i].options[oi].text = e.target.value;
    snapshot();
  }));
  $$(".q-option input[type=radio], .q-option input[type=checkbox]").forEach(inp => {
    inp.addEventListener("change", e => {
      const card = e.target.closest(".q-card");
      const i = +card.dataset.qi;
      const q = builder.questions[i];
      const optId = e.target.dataset.optId;
      if (q.type === "radio" || q.type === "boolean") {

function formToJSON(f) {
  return {
    title: f.title,
    description: f.description,
    postcode: f.postcode,
    timeLimit: f.settings.timeLimit,
    dueDate: f.settings.dueDate,
    shuffle: f.settings.shuffle,
    questions: f.questions.map(q => {
      const base = { type: q.type, text: q.text, points: q.points, required: q.required, explanation: q.explanation || "" };
      if (q.type === "text") return { ...base, correct: q.correct || "" };
      const correctIdx = q.options.map((o, i) => q.correct.includes(o.id) ? i : -1).filter(i => i >= 0);
      return { ...base, options: q.options.map(o => o.text), correct: correctIdx };
    }),
  };
}

function parseQuizCode(code) {
  code = String(code || "").trim();
  if (!code) return { error: "Code trống." };
  if (code.length > 500000) return { error: "Code quá lớn (tối đa 500KB)." };

  if (code.startsWith("{")) {
    try {
      const raw = JSON.parse(code);
      const data = Security.sanitize(raw);
      return validateQuizJSON(data);
    } catch (e) {
      return { error: "JSON không hợp lệ: " + e.message };
    }
  }
  return parseTextFormat(code);
}

function validateQuizJSON(data) {
  if (!data || typeof data !== "object" || Array.isArray(data)) return { error: "Dữ liệu không phải object." };
  const quiz = newEmptyBuilder();
  quiz.title = String(data.title || "").slice(0, 200);
  quiz.description = String(data.description || "").slice(0, 2000);
  quiz.postcode = String(data.postcode || "").slice(0, 40).toUpperCase();
  quiz.settings.timeLimit = Math.max(0, Math.min(600, Number(data.timeLimit) || 0));
  quiz.settings.dueDate = String(data.dueDate || "").slice(0, 20);
  quiz.settings.shuffle = !!data.shuffle;

  if (Array.isArray(data.questions)) {
    data.questions.slice(0, 200).forEach(q => {
      if (!q || typeof q !== "object") return;
      const type = ["radio", "checkbox", "text", "boolean"].includes(q.type) ? q.type : "radio";
      const qq = {
        id: uid("q"),
        type,
        text: String(q.text || "").slice(0, 1000),
        points: Math.max(0, Math.min(100, Number(q.points) || 1)),
        required: !!q.required,
        explanation: String(q.explanation || "").slice(0, 1000),
        correct: type === "text" ? String(q.correct || "").slice(0, 500) : [],
      };
      if (type !== "text") {
        if (type === "boolean") {
          qq.options = [{ id: uid("o"), text: "Đúng" }, { id: uid("o"), text: "Sai" }];
          const correctIdx = Array.isArray(q.correct) ? q.correct : [];
          qq.correct = correctIdx.filter(i => i === 0 || i === 1).map(i => qq.options[i].id);
        } else {
          const opts = Array.isArray(q.options) ? q.options.slice(0, 20) : [];
          qq.options = opts.length ? opts.map(t => ({ id: uid("o"), text: String(t ?? "").slice(0, 500) }))
                                    : [{ id: uid("o"), text: "" }, { id: uid("o"), text: "" }];
          const correctIdx = Array.isArray(q.correct) ? q.correct : [];
          qq.correct = correctIdx.filter(i => Number.isInteger(i) && i >= 0 && i < qq.options.length)
                                  .map(i => qq.options[i].id);
        }
        if (type === "radio" && qq.correct.length > 1) qq.correct = qq.correct.slice(0, 1);
        if (type === "boolean" && qq.correct.length > 1) qq.correct = qq.correct.slice(0, 1);
      }
      quiz.questions.push(qq);
    });
  }
  if (quiz.questions.length === 0) return { error: "Không có câu hỏi nào hợp lệ." };
  return { quiz };
}

function parseTextFormat(code) {
  const lines = code.split("\n");
  const quiz = newEmptyBuilder();
  let current = null;

  for (const raw of lines) {
    const line = raw.trim();
    if (!line) continue;

    if (line.startsWith("## ")) { quiz.description = line.slice(3).trim().slice(0, 2000); continue; }
    if (line.startsWith("# ")) { quiz.title = line.slice(2).trim().slice(0, 200); continue; }
    if (line.startsWith(">> Giải thích:") || line.startsWith(">>")) {
      if (current) {
        current.explanation = line.replace(/^>>\s*(Giải thích:)?\s*/i, "").trim().slice(0, 1000);
      }
      continue;
    }

    const qm = line.match(/^Q\d+\.\s*(.+)$/i);
    if (qm) {
      if (current) quiz.questions.push(current);
      let text = qm[1].trim();
      let type = "radio", points = 1, required = false;

      const tm = text.match(/\[(radio|checkbox|text|boolean)\]/i);
      if (tm) { type = tm[1].toLowerCase(); text = text.replace(tm[0], "").trim(); }
      const pm = text.match(/\[(\d+(?:\.\d+)?)\s*(?:điểm|diem|point|pts?)?\]/i);
      if (pm) { points = Math.max(0, Math.min(100, parseFloat(pm[1]))); text = text.replace(pm[0], "").trim(); }
      if (/\[(?:required|bắt buộc|bat buoc)\]/i.test(text)) {
        required = true; text = text.replace(/\[(?:required|bắt buộc|bat buoc)\]/gi, "").trim();
      }

      current = {
        id: uid("q"), type, text, points, required, explanation: "",
        correct: type === "text" ? "" : [],
        ...(type === "text" ? {} : { options: [] }),
      };

      if (type === "boolean") {
        current.options = [{ id: uid("o"), text: "Đúng" }, { id: uid("o"), text: "Sai" }];
      }
      continue;
    }

    if (current && current.type !== "text" && /^[-*]/.test(line)) {
      let optText = line.slice(1).trim();
      let isCorrect = false;
      if (/\((?:đúng|dung|correct|x)\)/i.test(optText)) {
        isCorrect = true;
        optText = optText.replace(/\((?:đúng|dung|correct|x)\)/gi, "").trim();
      }
      if (/^\[x\]/i.test(optText)) { isCorrect = true; optText = optText.replace(/^\[x\]\s*/i, "").trim(); }
      
      if (current.type === "boolean") {
        if (optText.toLowerCase() === "đúng" && isCorrect) current.correct = [current.options[0].id];
        if (optText.toLowerCase() === "sai" && isCorrect) current.correct = [current.options[1].id];
      } else {
        const opt = { id: uid("o"), text: optText.slice(0, 500) };
        current.options.push(opt);
        if (isCorrect) current.correct.push(opt.id);
      }
      continue;
    }

    if (current && current.type === "text" && line.startsWith("=")) {
      current.correct = line.slice(1).trim().slice(0, 500);
      continue;
    }
  }
  if (current) quiz.questions.push(current);

  quiz.questions.forEach(q => {
    if (q.type !== "text" && q.type !== "boolean" && q.options.length === 0) {
      q.options = [{ id: uid("o"), text: "" }, { id: uid("o"), text: "" }];
    }
    if ((q.type === "radio" || q.type === "boolean") && q.correct.length > 1) q.correct = q.correct.slice(0, 1);
  });

  if (quiz.questions.length === 0) return { error: "Không tìm thấy câu hỏi nào (định dạng: Q1. ... [radio] [1 điểm])." };
  return { quiz };
}

function loadTestByCode(rawCode) {
  const code = String(rawCode || "").trim().toUpperCase();
  if (!code) return toast("Nhập mã code");
  const form = State.forms.find(f => f.code.toUpperCase() === code);
  if (!form) return toast("Không tìm thấy bài kiểm tra với mã này");
  if (!State.currentUser) {
    pendingCode = code;
    return openAuth("login");
  }
  if (form.settings.dueDate && new Date(form.settings.dueDate) < new Date()) {
    return toast("Bài kiểm tra đã hết hạn");
  }
  startTest(form);
}

function startTest(form) {
  const questions = form.settings.shuffle ? [...form.questions].sort(() => Math.random() - 0.5) : form.questions;
  activeTest = {
    form, questions,
    answers: {},
    startedAt: Date.now(),
    endsAt: form.settings.timeLimit > 0 ? Date.now() + form.settings.timeLimit * 60000 : null,
  };
  renderTestRunner();
}

function renderTestRunner() {
  if (!activeTest) return navigate("take");
  const { form, questions } = activeTest;

  app.innerHTML = `
    <div class="test-runner">
      <div class="test-header">
        <div>
          <h2>${esc(form.title || "Bài kiểm tra")}</h2>
          <div class="test-meta">
            ${form.description ? esc(form.description) + " · " : ""}
            ${questions.length} câu · Tổng ${questions.reduce((s, q) => s + (q.points || 0), 0)} điểm
            ${form.settings.timeLimit ? ` · ${form.settings.timeLimit} phút` : ""}
          </div>
        </div>
        ${activeTest.endsAt ? `<div class="timer" id="timer">--:--</div>` : ""}
      </div>
      <form id="testForm">
        ${questions.map((q, i) => renderQuestionForTest(q, i)).join("")}
        <button type="submit" class="btn primary" style="width:100%;padding:16px;font-size:16px;">Nộp bài</button>
      </form>
    </div>
  `;

  $("#testForm").addEventListener("submit", e => {
    e.preventDefault();
    submitTest();
  });

  $$(".answer-item").forEach(el => {
    el.addEventListener("click", () => {
      const qid = el.dataset.qid;
      const optId = el.dataset.optId;
      const q = questions.find(x => x.id === qid);
      if (!q) return;
      if (q.type === "radio" || q.type === "boolean") {
        activeTest.answers[qid] = [optId];
      } else {
        const arr = activeTest.answers[qid] || [];
        if (arr.includes(optId)) activeTest.answers[qid] = arr.filter(x => x !== optId);
        else activeTest.answers[qid] = [...arr, optId];
      }
      const block = $(`[data-block-qid="${qid}"]`);
      if (block) {
        $$(".answer-item", block).forEach(a => {
          const aid = a.dataset.optId;
          const cur = activeTest.answers[qid] || [];
          a.classList.toggle("checked", cur.includes(aid));
        });
      }
    });
  });
  $$(".answer-text").forEach(ta => {
    ta.addEventListener("input", e => {
      activeTest.answers[ta.dataset.qid] = e.target.value;
    });
  });

  if (activeTest.endsAt) {
    if (timerInterval) clearInterval(timerInterval);
    const tick = () => {
      const left = Math.floor((activeTest.endsAt - Date.now()) / 1000);
      const tEl = $("#timer");
      if (!tEl) return;
      tEl.textContent = fmtTime(left);
      tEl.classList.toggle("warn", left <= 60);
      if (left <= 0) {
        clearInterval(timerInterval);
        timerInterval = null;
        toast("Hết giờ! Tự động nộp bài.");
        submitTest();
      }
    };
    tick();
    timerInterval = setInterval(tick, 500);
  }
}

function renderQuestionForTest(q, i) {
  const sub = `${q.points} điểm${q.required ? ' · <span class="req">Bắt buộc</span>' : ""}`;
  let answersHtml = "";

  if (q.type === "text") {
    answersHtml = `<textarea class="answer-text" data-qid="${esc(q.id)}" placeholder="Nhập câu trả lời..." rows="3" maxlength="2000"></textarea>`;
  } else {
    answersHtml = `<div class="answer-list">
      ${q.options.map(o => `
        <div class="answer-item ${q.type === "checkbox" ? "multi" : ""}" data-qid="${esc(q.id)}" data-opt-id="${esc(o.id)}">
          <div class="marker"></div>
          <div style="flex:1;font-size:15px;font-weight:500;">${esc(o.text || "(trống)")}</div>
        </div>
      `).join("")}
    </div>`;
  }

  return `
    <div class="question-block" data-block-qid="${esc(q.id)}">
      <h3>Câu ${i + 1}. ${esc(q.text || "(chưa có nội dung)")}</h3>
      <div class="q-sub">${sub}</div>
      ${answersHtml}
    </div>
  `;
}

function submitTest() {
  if (!activeTest) return;
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

  const { form, questions, answers, startedAt } = activeTest;
  let score = 0, total = 0;
  const detail = [];

  for (const q of questions) {
    total += q.points || 0;
    const ans = answers[q.id];
    let correct = false;
    if (q.type === "text") {
      const given = String(ans || "").trim().toLowerCase();
      const expected = String(q.correct || "").trim().toLowerCase();
      correct = given && given === expected;
    } else if (q.type === "radio" || q.type === "boolean") {
      const given = Array.isArray(ans) ? ans : [];
      correct = given.length === 1 && (q.correct || []).length === 1 && given[0] === q.correct[0];
    } else {
      const given = Array.isArray(ans) ? [...ans].sort() : [];
      const expected = [...(q.correct || [])].sort();
      correct = given.length === expected.length && given.every((v, i) => v === expected[i]);
    }
    if (correct) score += q.points || 0;
    detail.push({ qid: q.id, correct, explanation: q.explanation || "", text: q.text, type: q.type, options: q.options || [], correctAnswer: q.correct, userAnswer: ans });
  }

  const response = {
    id: uid("r"),
    formId: form.id,
    formCode: form.code,
    formTitle: form.title,
    postcode: form.passcode || "",
    username: State.currentUser,
    ip: getFakeIP(),
    score, total,
    detail,
    startedAt,
    submittedAt: Date.now(),
    duration: Math.round((Date.now() - startedAt) / 1000),
  };
  State.responses.unshift(response);
  saveDB();
  activeTest = null;
  navigate("results", { justFinished: response.id });
}

/* ============================================================
   RESULTS
============================================================ */
function renderResults() {
  const user = getUser();
  if (!user) {
    app.innerHTML = `<section class="view"><div class="empty"><div class="big">🔒</div>Vui lòng đăng nhập để xem kết quả.</div></section>`;
    return;
  }

  if (viewParams.justFinished) {
    const r = State.responses.find(x => x.id === viewParams.justFinished);
    if (r) {
      const pct = r.total > 0 ? Math.round((r.score / r.total) * 100) : 0;
      app.innerHTML = `
        <section class="view">
          <div class="result-screen">
            <div style="font-size:40px;margin-bottom:6px;">${pct >= 80 ? "🎉" : pct >= 50 ? "👍" : "💪"}</div>
            <h2 style="font-size:22px;font-weight:800;letter-spacing:-0.02em;color:#000;">Hoàn thành bài kiểm tra!</h2>
            <div class="score-big">${r.score}/${r.total}</div>
            <div class="pct">${pct}% · ${r.formTitle || "Bài kiểm tra"}</div>
            <div style="margin-top:22px;font-size:13px;color:var(--text-dim);font-weight:500;">
              ⏱ ${r.duration}s · ${fmtDateTime(r.submittedAt)}
            </div>
            
            <div style="margin-top:30px; text-align:left; background:rgba(255,255,255,0.5); border:1px solid var(--border); border-radius:12px; padding:16px; max-height:300px; overflow-y:auto;">
              <h4 style="font-size:14px; font-weight:800; margin-bottom:10px; color:#000;">Chi tiết & Giải thích</h4>
              ${r.detail.map((d, idx) => `
                <div style="margin-bottom:12px; padding-bottom:12px; border-bottom:1px dashed rgba(0,0,255,0.1);">
                  <div style="font-weight:600; font-size:13.5px; margin-bottom:4px; color:${d.correct ? 'var(--ok)' : 'var(--danger)'};">
                    Câu ${idx + 1}: ${d.correct ? "Đúng" : "Sai"}
                  </div>
                  <div style="font-size:13px; color:#000; margin-bottom:6px;">${esc(d.text)}</div>
                  ${d.explanation ? `<div style="font-size:12.5px; background:rgba(0,0,255,0.04); padding:8px; border-radius:6px; color:var(--text-dim);"><b>Giải thích:</b> ${esc(d.explanation)}</div>` : ""}
                </div>
              `).join("")}
            </div>

            <div style="margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
              <button class="btn ghost" data-nav="take">Làm bài khác</button>
              <button class="btn primary" id="backToResults">Xem tất cả kết quả</button>
            </div>
          </div>
        </section>
      `;
      $("#backToResults").addEventListener("click", () => navigate("results"));
      return;
    }
  }

  const myResponses = State.responses.filter(r => r.username === user.username);
  const myForms = State.forms.filter(f => f.author === user.username);

  app.innerHTML = `
    <section class="view">
      <h1 class="page-title">Kết quả</h1>
      <p class="page-sub">Bài đã làm và bài đã tạo của bạn.</p>

      <h3 style="font-size:16px;font-weight:800;margin:26px 0 14px;color:#000;">📝 Bài đã làm (${myResponses.length})</h3>
      ${myResponses.length === 0
        ? `<div class="empty"><div class="big">📭</div>Chưa làm bài nào.</div>`
        : `<div class="card" style="padding:0;overflow:hidden;">
            <div class="table-wrap">
              <table>
                <thead><tr><th>Bài</th><th>Điểm</th><th>Thời gian</th><th>Ngày nộp</th></tr></thead>
                <tbody>
                  ${myResponses.map(r => `
                    <tr>
                      <td style="font-weight:600;">${esc(r.formTitle || r.formCode)}</td>
                      <td><span class="badge ${r.total > 0 && r.score / r.total >= 0.5 ? "ok" : "bad"}">${r.score}/${r.total}</span></td>
                      <td>${r.duration}s</td>
                      <td style="color:var(--text-dim);font-size:13px;">${fmtDateTime(r.submittedAt)}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          </div>`
      }

      <h3 style="font-size:16px;font-weight:800;margin:26px 0 14px;color:#000;">📋 Bài đã tạo (${myForms.length})</h3>
      ${myForms.length === 0
        ? `<div class="empty"><div class="big">📋</div>Chưa tạo bài nào.</div>`
        : myForms.map(f => {
            const resp = State.responses.filter(r => r.formId === f.id);
            return `
              <div class="form-list-item" style="cursor:pointer;" data-view-form="${esc(f.id)}">
                <div>
                  <div class="fl-title">${esc(f.title || "(chưa đặt tên)")}</div>
                  <div class="fl-meta">
                    Mã: <b style="color:var(--blue);">${esc(f.code)}</b> ·
                    ${f.questions.length} câu · ${resp.length} lượt làm
                    ${f.passcode ? ` · Postcode: <b>${esc(f.passcode)}</b>` : ""}
                  </div>
                </div>
                <div class="fl-actions" style="pointer-events:none;">
                  <span class="btn ghost small" style="pointer-events:auto;">Xem danh sách →</span>
                </div>
              </div>
            `;
          }).join("")
      }
    </section>
  `;

  $$("[data-view-form]").forEach(b => b.addEventListener("click", () => {
    navigate("results", { viewForm: b.dataset.viewForm });
  }));

  if (viewParams.viewForm) {
    const f = State.forms.find(x => x.id === viewParams.viewForm);
    if (f) openFormResponses(f);
  }
}

function openFormResponses(form) {
  const responses = State.responses.filter(r => r.formId === form.id);
  const root = $("#modalRoot");
  const isAdminUser = isAdmin();
  const ipHeader = isAdminUser ? `<th>IP mạng</th>` : "";
  root.innerHTML = `
    <div class="modal-backdrop" data-close="1">
      <div class="modal wide">
        <button class="modal-close" data-close="1">✕</button>
        <h2 style="font-size:20px;font-weight:800;margin-bottom:6px;color:#000;">${esc(form.title || "Bài kiểm tra")}</h2>
        <div style="font-size:13px;color:var(--text-dim);margin-bottom:18px;font-weight:500;">
          Mã: <b style="color:var(--blue);">${esc(form.code)}</b> · ${responses.length} lượt làm
        </div>
        ${responses.length === 0
          ? `<div class="empty">Chưa có ai làm bài này.</div>`
          : `<div class="table-wrap"><table>
              <thead><tr><th>Tên (Gmail)</th>${ipHeader}<th>Điểm</th><th>Ngày nộp</th><th>Hành động</th></tr></thead>
              <tbody>
                ${responses.map(r => `
                  <tr>
                    <td style="font-weight:700;color:#000;">${esc(r.username)}@gmail.com</td>
                    ${isAdminUser ? `<td style="font-size:12px;color:var(--text-dim);font-family:monospace;">${esc(r.ip || "N/A")}</td>` : ""}
                    <td><span class="badge ${r.total > 0 && r.score / r.total >= 0.5 ? "ok" : "bad"}">${r.score}/${r.total}</span></td>
                    <td style="color:var(--text-dim);font-size:13px;">${fmtDateTime(r.submittedAt)}</td>
                    <td><button class="btn ghost small" data-view-detail="${esc(r.id)}">Chi tiết</button></td>
                  </tr>
                `).join("")}
              </tbody>
            </table></div>`
        }
      </div>
    </div>
  `;

  $$("[data-view-detail]").forEach(btn => btn.addEventListener("click", () => {
    const res = State.responses.find(x => x.id === btn.dataset.viewDetail);
    if (!res) return;
    let html = `<div style="max-height: 400px; overflow-y:auto; padding-right:10px;">`;
    res.detail.forEach((d, idx) => {
      html += `
        <div style="margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid rgba(0,0,255,0.1);">
          <div style="font-weight:700; font-size:14px; margin-bottom:4px; color:${d.correct ? 'var(--ok)' : 'var(--danger)'};">Câu ${idx + 1}: ${d.correct ? "Đúng" : "Sai"}</div>
          <div style="font-size:13px; margin-bottom:6px;">${esc(d.text)}</div>
          ${d.explanation ? `<div style="font-size:12.5px; background:rgba(0,0,255,0.04); padding:8px; border-radius:6px; color:var(--text-dim);"><b>Giải thích:</b> ${esc(d.explanation)}</div>` : ""}
        </div>
      `;
    });
    html += `</div>`;
    
    const detailRoot = document.createElement('div');
    detailRoot.className = "modal-backdrop";
    detailRoot.style.zIndex = 600;
    detailRoot.innerHTML = `
      <div class="modal">
        <button class="modal-close" onclick="this.closest('.modal-backdrop').remove()">✕</button>
        <h3 style="font-size:18px;font-weight:800;margin-bottom:14px;color:#000;">Chi tiết bài làm: ${esc(res.username)}</h3>
        ${html}
      </div>
    `;
    document.body.appendChild(detailRoot);
  }));

  root.querySelectorAll("[data-close]").forEach(el => el.addEventListener("click", e => {
    if (e.target === el) { closeModal(); navigate("results"); }
  }));
}

/* ============================================================
   ADMIN
============================================================ */
function renderAdmin() {
  if (!isAdmin()) {
    app.innerHTML = `<section class="view"><div class="empty"><div class="big">🔒</div>Chỉ admin mới truy cập được.</div></section>`;
    return;
  }

  app.innerHTML = `
    <section class="view">
      <h1 class="page-title">Bảng điều khiển Admin</h1>
      <p class="page-sub">Quản lý postcode lớp, xem bài kiểm tra và kết quả toàn hệ thống.</p>

      <h3 style="font-size:16px;font-weight:800;margin:26px 0 14px;color:#000;">🏫 Postcode lớp</h3>
      <div class="card">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px;">
          <input id="pcCode" class="opt-text" placeholder="Mã (VD: MATH10A)" maxlength="20" style="background:#fff;" />
          <input id="pcClass" class="opt-text" placeholder="Tên lớp (VD: 10A1)" maxlength="40" style="background:#fff;" />
          <input id="pcSubject" class="opt-text" placeholder="Môn (VD: Toán)" maxlength="40" style="background:#fff;" />
          <button class="btn primary" id="addPc">+ Thêm</button>
        </div>
        ${State.postcodes.length === 0
          ? `<div style="color:var(--text-dim);font-size:13px;text-align:center;padding:12px;font-weight:500;">Chưa có postcode nào.</div>`
          : `<div class="table-wrap"><table>
              <thead><tr><th>Mã</th><th>Lớp</th><th>Môn</th><th></th></tr></thead>
              <tbody>
                ${State.postcodes.map((p, i) => `
                  <tr>
                    <td><b style="color:var(--blue);">${esc(p.code)}</b></td>
                    <td style="font-weight:600;">${esc(p.className)}</td>
                    <td>${esc(p.subject)}</td>
                    <td><button class="icon-btn danger" data-del-pc="${i}">🗑</button></td>
                  </tr>
                `).join("")}
              </tbody>
            </table></div>`
        }
      </div>

      <h3 style="font-size:16px;font-weight:800;margin:26px 0 14px;color:#000;">📋 Tất cả bài kiểm tra (${State.forms.length})</h3>
      ${State.forms.length === 0
        ? `<div class="empty">Chưa có bài nào.</div>`
        : State.forms.map(f => {
            const resp = State.responses.filter(r => r.formId === f.id);
            return `
              <div class="form-list-item" style="cursor:pointer;" data-view-form="${esc(f.id)}">
                <div>
                  <div class="fl-title">${esc(f.title || "(chưa đặt)")}</div>
                  <div class="fl-meta">
                    Mã: <b style="color:var(--blue);">${esc(f.code)}</b> · Tác giả: <b>${esc(f.author || "?")}</b> ·
                    ${resp.length} lượt làm
                    ${f.passcode ? ` · Postcode: <b>${esc(f.passcode)}</b>` : ""}
                  </div>
                </div>
                <div class="fl-actions" style="pointer-events:none;">
                  <span class="btn ghost small" style="pointer-events:auto;">Xem danh sách →</span>
                </div>
              </div>
            `;
          }).join("")
      }

      <h3 style="font-size:16px;font-weight:800;margin:26px 0 14px;color:#000;">👥 Người dùng (${State.users.length})</h3>
      <div class="card" style="padding:0;overflow:hidden;">
        <div class="table-wrap"><table>
          <thead><tr><th>Tên</th><th>Vai trò</th><th>Tạo lúc</th></tr></thead>
          <tbody>
            ${State.users.map(u => `
              <tr>
                <td style="font-weight:700;color:#000;">${esc(u.username)}</td>
                <td><span class="badge ${u.isAdmin ? "admin" : ""}">${u.isAdmin ? "👑 Admin" : "User"}</span></td>
                <td style="color:var(--text-dim);font-size:13px;">${fmtDateTime(u.createdAt || 0)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table></div>
      </div>
    </section>
  `;

  $("#addPc").addEventListener("click", () => {
    const code = $("#pcCode").value.trim().toUpperCase();
    const className = $("#pcClass").value.trim();
    const subject = $("#pcSubject").value.trim();
    if (!code || !className) return toast("Nhập mã và tên lớp");
    if (State.postcodes.some(p => p.code === code)) return toast("Mã đã tồn tại");
    State.postcodes.push({ code, className, subject });
    saveDB(); renderAdmin(); toast("Đã thêm postcode");
  });
  $$("[data-del-pc]").forEach(b => b.addEventListener("click", () => {
    if (!confirm("Xoá postcode này?")) return;
    State.postcodes.splice(+b.dataset.delPc, 1);
    saveDB(); renderAdmin();
  }));
  $$("[data-del-form]").forEach(b => b.addEventListener("click", () => {
    if (!confirm("Xoá bài kiểm tra này và tất cả kết quả?")) return;
    const id = b.dataset.delForm;
    State.forms = State.forms.filter(f => f.id !== id);
    State.responses = State.responses.filter(r => r.formId !== id);
    saveDB(); renderAdmin();
  }));
  $$("[data-view-form]").forEach(b => b.addEventListener("click", () => {
    const f = State.forms.find(x => x.id === b.dataset.viewForm);
    if (f) openFormResponses(f);
  }));
}

/* ============================================================
   GLOBAL EVENTS
============================================================ */
document.body.addEventListener("click", e => {
  const navBtn = e.target.closest("[data-nav]");
  if (navBtn) return navigate(navBtn.dataset.nav);

  const goBtn = e.target.closest("[data-go]");
  if (goBtn) return navigate(goBtn.dataset.go);

  const act = e.target.closest("[data-action]");
  if (act) {
    const action = act.dataset.action;
    if (action === "login") openAuth("login");
    else if (action === "register") openAuth("register");
    else if (action === "logout") {
      Security.endSession();
      State.currentUser = null;
      toast("Đã đăng xuất");
      navigate("home");
    }
  }
});

const devBadge = $("#devBadge");
function openDevLink() {
  window.open("https://konect.gg/klegg", "_blank", "noopener,noreferrer");
}
devBadge.addEventListener("click", openDevLink);
devBadge.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDevLink(); }
});

/* ============================================================
   BOOT
============================================================ */
loadDB();
resizeCanvas();
drawDots();
Security.deterSourceView();
render();
</script>
